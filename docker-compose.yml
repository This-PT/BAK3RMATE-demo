services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kumtun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kumtun}
      POSTGRES_DB: kumtun
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumtun -d kumtun"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://kumtun:${POSTGRES_PASSWORD:-kumtun}@db:5432/kumtun
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
