# keep https if a proxy in front of this one (e.g. Caddy) already terminated it
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's DNS, re-checked every 5s, so a restarted backend is found again without restarting nginx.
  resolver 127.0.0.11 valid=5s;

  location /api/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
  }

  location / {
    try_files $uri /index.html;
  }
}
