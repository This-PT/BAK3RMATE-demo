# Settings for the one-container (pay-per-use) version. Copy this file to env.cloudrun.yaml and fill it in.
# Delete the lines you don't use. Keep the quotes. env.cloudrun.yaml holds secrets: it is ignored by git, never share it.

# From Neon: the "pooled" connection string. It must end with ?sslmode=require
DATABASE_URL: "postgres://USER:PASSWORD@HOST/neondb?sslmode=require"

# Only this email can take over the starting data and sign up first. Use your own Gmail.
ADMIN_EMAIL: "you@gmail.com"

# Sign in with Google (the same ones you use on your computer)
GOOGLE_CLIENT_ID: ""
GOOGLE_CLIENT_SECRET: ""

# Optional features
OPENAI_API_KEY: ""
ELEVENLABS_API_KEY: ""
ELEVENLABS_VOICE_ID: ""

# Cloud Run puts one proxy in front of the app. Small database pool because each copy of the app has its own.
TRUST_PROXY_HOPS: "1"
PG_POOL_MAX: "5"

# Do NOT set PUBLIC_URL here: the app works out its own https address.
# Add SEED_DEMO_DATA: "1" only if you want the sample bakery on a brand-new empty database.
